name: 构建与 1.21.1 铁砧兼容性

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          validate-wrappers: true
      - name: 构建主模组与仅 CI 探针
        shell: bash
        run: |
          set -euo pipefail
          run_build() {
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              ./gradlew build :ci-probe:remapJar -PreleaseVersion="${GITHUB_REF_NAME#v}"
            else
              ./gradlew build :ci-probe:remapJar
            fi
          }
          set +e
          run_build 2>&1 | tee ci-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          exit "$build_status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1.21.1-构建诊断
          path: ci-build.log
          if-no-files-found: error
      - name: 整理唯一的可运行 jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/main ci-artifacts/probe
          mapfile -t main_jars < <(find build/libs -maxdepth 1 -type f -name 'tinkerers-smithing-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          mapfile -t probe_jars < <(find ci-probe/build/libs -maxdepth 1 -type f -name 'tinkerers-smithing-ci-probe-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          test "${#main_jars[@]}" -eq 1
          test "${#probe_jars[@]}" -eq 1
          cp "${main_jars[0]}" ci-artifacts/main/
          cp "${probe_jars[0]}" ci-artifacts/probe/
      - uses: actions/upload-artifact@v4
        with:
          name: 1.21.1-主模组-jar
          path: ci-artifacts/main/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: 1.21.1-铁砧探针-jar
          path: ci-artifacts/probe/
          if-no-files-found: error

  fabric-1211:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 1.21.1-主模组-jar
          path: ci-artifacts/main
      - uses: actions/download-artifact@v4
        with:
          name: 1.21.1-铁砧探针-jar
          path: ci-artifacts/probe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 在 Fabric 1.21.1 服务端运行真实铁砧探针
        run: ci/run-fabric-1211-probe.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-1211-铁砧诊断
          path: |
            .ci-fabric-1211-server/console.log
            .ci-fabric-1211-server/compat-result.json
            .ci-fabric-1211-server/logs/**
            .ci-fabric-1211-server/.mixin.out/**
          if-no-files-found: warn

  neoforge-1211-connector-ffapi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 1.21.1-主模组-jar
          path: ci-artifacts/main
      - uses: actions/download-artifact@v4
        with:
          name: 1.21.1-铁砧探针-jar
          path: ci-artifacts/probe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 在 NeoForge 1.21.1、Connector、FFAPI 服务端运行真实铁砧探针
        run: ci/run-neoforge-1211-probe.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1211-connector-ffapi-铁砧诊断
          path: |
            .ci-neoforge-1211-server/console.log
            .ci-neoforge-1211-server/compat-result.json
            .ci-neoforge-1211-server/connector-transformed-jars.txt
            .ci-neoforge-1211-server/connector-transformed-refmap.json
            .ci-neoforge-1211-server/connector-transformed-anvil-mixin.javap.txt
            .ci-neoforge-1211-server/connector-patch-audit.txt
            .ci-neoforge-1211-server/mods/.connector/**
            .ci-neoforge-1211-server/logs/**
            .ci-neoforge-1211-server/.mixin.out/**
          if-no-files-found: warn

  release:
    needs: [build, fabric-1211, neoforge-1211-connector-ffapi]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v2.7.2+1.21-neoforge-fix.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 1.21.1-主模组-jar
          path: release-artifact
      - name: 校验全绿构建附件
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find release-artifact -maxdepth 1 -type f -name 'tinkerers-smithing-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          test "${#jars[@]}" -eq 1
          jar_name=$(basename "${jars[0]}")
          sha256sum "${jars[0]}" | tee "release-artifact/${jar_name}.sha256"
      - name: 发布经全绿验证的 fork 构建
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name }}
          body: |
            这是 SGSxingchen fork 的非上游官方构建。

            适用 Minecraft 1.21.1 的 NeoForge 21.1.x + Sinytra Connector + Forgified Fabric API 环境；同时保留 Fabric 1.21.1 基线。

            前置：Connector 2.0.0-beta.14+1.21.1-full 与 Forgified Fabric API 0.116.7+2.2.4+1.21.1。

            已在 GitHub Hosted Runner 的真实 dedicated server 铁砧探针验证材料修理、错误材料拒绝、下界合金规则、同物品合并与改名；未覆盖其他模组组合与客户端图形界面交互。
          files: |
            release-artifact/*.jar
            release-artifact/*.jar.sha256
